services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: Kulle12345
      MYSQL_DATABASE: MormorDagnydb
      MYSQL_USER: mormordagny
      MYSQL_PASSWORD: Kulle12345
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql

  mormordagny-api:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: mormordagny3-api:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__mysqldev: Server=mysql;Port=3306;User=mormordagny;Password=Kulle12345;Database=MormorDagnydb
    ports:
      - "5001:8080"
    depends_on:
      - mysql

volumes:
  mysqldata:
